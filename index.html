<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>Spotify Lyrics & Karaoke</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-spotify">
    <!-- Fondo ambiental dinámico -->
    <div id="bg-blur"></div>

    <div id="app">
        <!-- Pantalla de Inicio -->
        <button id="login-btn" onclick="redirectToSpotify()">Conectar con Spotify</button>

        <!-- Contenedor Principal del Reproductor -->
        <div id="player-container" class="hidden">
            
            <!-- Panel / Menú de Control -->
            <header id="top-bar">
                <div id="track-header">
                    <!-- Nombre de la playlist actual entrecomillado encima del álbum -->
                    <div id="playlist-context-label" class="hidden">"---"</div>
                    <img id="album-cover" src="" alt="Portada">
                    <div id="track-details">
                        <h2 id="track-title">Sin reproducción</h2>
                        <p id="artist-name">-</p>
                        <p id="album-name">-</p>
                    </div>
                    <div id="header-actions">
                        <button class="icon-btn" onclick="manualSyncLyrics(event)" title="Sincronizar/Refrescar Letra">🔄</button>
                        <button class="icon-btn" onclick="toggleSettings(event)" title="Ajustes">⚙</button>
                        <button class="icon-btn" onclick="toggleFullscreen(event)" title="Pantalla Completa">⛶</button>
                    </div>
                </div>

                <!-- Botones de Control de Reproducción principales -->
                <div id="playback-controls" class="inline-controls">
                    <button class="control-btn" onclick="controlPlayback('previous', event)" title="Anterior">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="control-btn main-play" id="play-pause-btn" onclick="togglePlayPause(event)" title="Play/Pause">
                        <svg id="play-pause-svg" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="control-btn" onclick="controlPlayback('next', event)" title="Siguiente">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>

                <!-- Botones Shuffle y Repeat debajo en su propia fila -->
                <div id="secondary-playback-controls">
                    <button class="control-btn secondary-btn" id="shuffle-btn" onclick="toggleShuffle(event)" title="Aleatorio">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                    </button>
                    <button class="control-btn secondary-btn" id="repeat-btn" onclick="toggleRepeat(event)" title="Repetir">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>
                </div>

                <!-- Barra de Progreso -->
                <div id="progress-wrapper">
                    <span id="time-elapsed">00:00</span>
                    <div id="progress-bar-container">
                        <div id="progress-bar-fill"></div>
                    </div>
                    <span id="time-remaining">-00:00</span>
                </div>
            </header>

            <!-- Quick Menu de Playlists (Barra Inferior limpia y ligera) -->
            <div id="playlists-dock">
                <div id="playlists-scroll-container">
                    <!-- Se inyectan dinámicamente solo carátulas y nombres -->
                </div>
                <button id="add-playlist-btn" onclick="openAddPlaylistModal(event)" title="Añadir Playlist">+</button>
            </div>

            <!-- Modal para Añadir Playlist por Link de Spotify -->
            <div id="add-playlist-modal" class="hidden">
                <div class="modal-content small-modal">
                    <div class="modal-header">
                        <h3>Añadir Playlist</h3>
                        <button class="close-btn" onclick="closeAddPlaylistModal()">✕</button>
                    </div>
                    <div class="modal-body">
                        <input type="text" id="playlist-uri-input" placeholder="Pega el link de Spotify (ej. https://open.spotify.com/playlist/...)">
                        <button onclick="saveNewPlaylist()">Añadir a Favoritos</button>
                    </div>
                </div>
            </div>

            <!-- Panel Flotante de Configuración -->
            <div id="settings-panel" class="hidden">
                <div class="settings-header">
                    <h3>Ajustes</h3>
                    <button class="close-btn" onclick="toggleSettings(event)">✕</button>
                </div>
                <div class="settings-group">
                    <label>Modo de vista:</label>
                    <button id="mode-btn" onclick="toggleKaraokeMode(event)">Activar Modo Karaoke 🎤</button>
                </div>
                <div class="settings-group">
                    <label>Tema de color:</label>
                    <div class="theme-picker">
                        <span class="dot spotify" onclick="setTheme('theme-spotify', event)"></span>
                        <span class="dot neon" onclick="setTheme('theme-neon', event)"></span>
                        <span class="dot synthwave" onclick="setTheme('theme-synthwave', event)"></span>
                        <span class="dot gold" onclick="setTheme('theme-gold', event)"></span>
                        <span class="dot mono" onclick="setTheme('theme-mono', event)"></span>
                    </div>
                </div>
            </div>

            <!-- Vista 1: Letra Completa (Con Pinch-to-Zoom) -->
            <main id="lyrics-container" class="zoom-target">
                <p class="placeholder">Reproduce una canción en Spotify para cargar la letra...</p>
            </main>

            <!-- Vista 2: Modo Karaoke (Con Pinch-to-Zoom) -->
            <main id="karaoke-container" class="zoom-target hidden">
                <div id="karaoke-current">Esperando canción...</div>
                <div id="karaoke-next">---</div>
            </main>

        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
