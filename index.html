<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>Spotify Lyrics & Karaoke</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-spotify">
    <!-- Fondo ambiental dinámico -->
    <div id="bg-blur"></div>

    <div id="app">
        <!-- Pantalla de Inicio -->
        <button id="login-btn" onclick="redirectToSpotify()">Conectar con Spotify</button>

        <!-- Contenedor Principal del Reproductor -->
        <div id="player-container" class="hidden">
            
            <!-- Panel / Menú de Control -->
            <header id="top-bar">
                <div id="track-header">
                    <img id="album-cover" src="" alt="Portada">
                    <div id="track-details">
                        <h2 id="track-title">Sin reproducción</h2>
                        <p id="artist-name">-</p>
                    </div>
                    <div id="header-actions">
                        <button class="icon-btn" onclick="toggleSettings(event)" title="Ajustes">⚙</button>
                        <button class="icon-btn" onclick="toggleFullscreen(event)" title="Pantalla Completa">⛶</button>
                    </div>
                </div>

                <!-- Barra de Progreso -->
                <div id="progress-wrapper">
                    <span id="time-elapsed">00:00</span>
                    <div id="progress-bar-container">
                        <div id="progress-bar-fill"></div>
                    </div>
                    <span id="time-remaining">-00:00</span>
                </div>
            </header>

            <!-- Panel Flotante de Configuración -->
            <div id="settings-panel" class="hidden">
                <div class="settings-header">
                    <h3>Ajustes</h3>
                    <button class="close-btn" onclick="toggleSettings(event)">✕</button>
                </div>
                <div class="settings-group">
                    <label>Modo de vista:</label>
                    <button id="mode-btn" onclick="toggleKaraokeMode(event)">Activar Modo Karaoke 🎤</button>
                </div>
                <div class="settings-group">
                    <label>Tema de color:</label>
                    <div class="theme-picker">
                        <span class="dot spotify" onclick="setTheme('theme-spotify', event)"></span>
                        <span class="dot neon" onclick="setTheme('theme-neon', event)"></span>
                        <span class="dot synthwave" onclick="setTheme('theme-synthwave', event)"></span>
                        <span class="dot gold" onclick="setTheme('theme-gold', event)"></span>
                        <span class="dot mono" onclick="setTheme('theme-mono', event)"></span>
                    </div>
                </div>
            </div>

            <!-- Vista 1: Letra Completa (Con soporte Pinch-to-Zoom) -->
            <main id="lyrics-container">
                <p class="placeholder">Reproduce una canción en Spotify para cargar la letra...</p>
            </main>

            <!-- Vista 2: Modo Karaoke Auto-Ajustado al 100% -->
            <main id="karaoke-container" class="hidden">
                <div id="karaoke-current">Esperando canción...</div>
                <div id="karaoke-next">---</div>
            </main>

        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
